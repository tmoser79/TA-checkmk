###### CMC / Nagios-compatible history ######
[checkmk_history.sample]
sourcetype = checkmk:history
source = /omd/sites/mysite/var/check_mk/core/history
interval = 30
count = -1
token.0.token = \[\d{10}\]
token.0.replacementType = timestamp
token.0.replacement = [%s]
token.1.token = @@host
token.1.replacementType = file
token.1.replacement = checkmk_hosts.list
token.2.token = @@service
token.2.replacementType = file
token.2.replacement = checkmk_services.list
token.3.token = @@contact
token.3.replacementType = file
token.3.replacement = checkmk_contacts.list

