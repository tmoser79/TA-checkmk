[checkmk_alert]
search = sourcetype=checkmk:alert OR sourcetype=checkmk:ec OR sourcetype=checkmk:status OR (sourcetype=checkmk:history (log_type="SERVICE ALERT" OR log_type="HOST ALERT" OR log_type="SERVICE NOTIFICATION" OR log_type="HOST NOTIFICATION"))
priority = 1
description = Checkmk monitoring alerts and notifications for the CIM Alerts data model

[checkmk_history]
search = sourcetype=checkmk:history
priority = 2
description = Checkmk CMC or Nagios-compatible monitoring history

[checkmk_ops]
search = sourcetype=checkmk:notify OR sourcetype=checkmk:mknotifyd OR sourcetype=checkmk:cmc OR sourcetype=checkmk:web OR sourcetype=checkmk:security OR sourcetype=checkmk:eventconsole OR sourcetype=checkmk:alerts_handler OR sourcetype=checkmk:dcd OR sourcetype=checkmk:liveproxyd
priority = 3
description = Checkmk site operational and audit logs
