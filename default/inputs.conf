# File monitors are disabled by default. Copy the stanzas you need into
# local/inputs.conf on the Universal Forwarder that runs on the Checkmk server
# and set disabled = 0. Site logs are typically mode 0600; grant the Splunk
# user read access (ACL or membership of the site group).

[monitor:///omd/sites/*/var/check_mk/core/history]
disabled = 1
sourcetype = checkmk:history
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/check_mk/core/archive]
disabled = 1
sourcetype = checkmk:history
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/nagios/nagios.log]
disabled = 1
sourcetype = checkmk:history
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/nagios.log]
disabled = 1
sourcetype = checkmk:history
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/notify.log]
disabled = 1
sourcetype = checkmk:notify
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/mknotifyd.log]
disabled = 1
sourcetype = checkmk:mknotifyd
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/cmc.log]
disabled = 1
sourcetype = checkmk:cmc
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/web.log]
disabled = 1
sourcetype = checkmk:web
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/security.log]
disabled = 1
sourcetype = checkmk:security
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/mkeventd.log]
disabled = 1
sourcetype = checkmk:eventconsole
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/alerts.log]
disabled = 1
sourcetype = checkmk:alerts_handler
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/dcd.log]
disabled = 1
sourcetype = checkmk:dcd
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/liveproxyd.log]
disabled = 1
sourcetype = checkmk:liveproxyd
index = checkmk
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/apache/access_log]
disabled = 1
sourcetype = apache:access:combined
index = web
crcSalt = <SOURCE>

[monitor:///omd/sites/*/var/log/apache/error_log]
disabled = 1
sourcetype = apache:error
index = web
crcSalt = <SOURCE>

# Optional REST status poller (Heavy Forwarder / Splunk Enterprise).
# Enable a named stanza in local/inputs.conf, for example:
#   [checkmk_rest://mysite]
#   api_url = https://checkmk.example.com/mysite
#   username = automation
#   secret = <automation-secret>
#   interval = 300
#   only_problems = 1
#   verify_tls = 1
#   index = checkmk
[checkmk_rest]
python.version = python3
