# Splunk Add-on for Checkmk
# Search-time knowledge. [checkmk:alert] stays raw JSON and is parsed at
# search time. Never set INDEXED_EXTRACTIONS on that sourcetype.

###### HEC JSON notifications (Checkmk notification plugin) ######
# Raw JSON event body. Fields come from search-time KV_MODE=json only.
[checkmk:alert]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 10000
category = Checkmk
description = Checkmk monitoring notifications received via Splunk HTTP Event Collector
pulldown_type = 1
EVAL-app = coalesce(app, "checkmk")
EVAL-vendor_product = coalesce(vendor_product, "Checkmk")
EVAL-type = coalesce(type, "alert")
EVAL-body = coalesce(body, description)
EVAL-description = coalesce(description, body)
EVAL-dest = coalesce(dest, dest_host, hostname)
EVAL-dest_host = coalesce(dest_host, dest, hostname)
EVAL-signature = coalesce(signature, service, "Host Check")
FIELDALIAS-checkmk_user_as_user = contact AS user
LOOKUP-checkmk_severity = checkmk_severity_lookup vendor_severity OUTPUTNEW severity, severity_id

[checkmk:ec]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = json
KV_MODE = none
AUTO_KV_JSON = false
TRUNCATE = 10000
category = Checkmk
description = Checkmk Event Console events forwarded to Splunk HEC
pulldown_type = 1
EVAL-app = coalesce(app, "checkmk")
EVAL-vendor_product = coalesce(vendor_product, "Checkmk")
EVAL-type = coalesce(type, "alert")
EVAL-dest = coalesce(dest, hostname)
LOOKUP-checkmk_severity = checkmk_severity_lookup vendor_severity OUTPUTNEW severity, severity_id

[checkmk:status]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = json
KV_MODE = none
AUTO_KV_JSON = false
TRUNCATE = 10000
category = Checkmk
description = Checkmk REST API host/service status snapshot
pulldown_type = 1
EVAL-app = coalesce(app, "checkmk")
EVAL-vendor_product = coalesce(vendor_product, "Checkmk")
EVAL-type = coalesce(type, "alert")
EVAL-dest = coalesce(dest, host_name)
EVAL-signature = coalesce(signature, description, "Host Check")
LOOKUP-checkmk_severity = checkmk_severity_lookup vendor_severity OUTPUTNEW severity, severity_id

###### CMC / Nagios-compatible monitoring history ######
[checkmk:history]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\[\d{10}\])
NO_BINARY_CHECK = true
TIME_PREFIX = \[
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 12
TRUNCATE = 10000
category = Checkmk
description = Checkmk CMC history or Raw Edition nagios.log
pulldown_type = 1
EXTRACT-history_header = ^\[(?P<history_epoch>\d+)\]\s+(?P<log_type>[A-Z][A-Z0-9 ]+?)(?::\s+|$)
EXTRACT-service_alert = ^\[\d+\]\s+SERVICE ALERT:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<vendor_severity>[^;]+);(?P<state_type>[^;]+);(?P<attempt>[^;]+);(?P<description>.*)
EXTRACT-host_alert = ^\[\d+\]\s+HOST ALERT:\s+(?P<dest>[^;]+);(?P<vendor_severity>[^;]+);(?P<state_type>[^;]+);(?P<attempt>[^;]+);(?P<description>.*)
EXTRACT-service_notification = ^\[\d+\]\s+SERVICE NOTIFICATION:\s+(?P<user>[^;]+);(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<vendor_severity>[^;]+);(?P<notify_command>[^;]+);(?P<description>.*)
EXTRACT-host_notification = ^\[\d+\]\s+HOST NOTIFICATION:\s+(?P<user>[^;]+);(?P<dest>[^;]+);(?P<vendor_severity>[^;]+);(?P<notify_command>[^;]+);(?P<description>.*)
EXTRACT-service_notification_result = ^\[\d+\]\s+SERVICE NOTIFICATION RESULT:\s+(?P<user>[^;]+);(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<vendor_severity>[^;]+);(?P<notify_command>[^;]+);(?P<description>.*)
EXTRACT-host_notification_result = ^\[\d+\]\s+HOST NOTIFICATION RESULT:\s+(?P<user>[^;]+);(?P<dest>[^;]+);(?P<vendor_severity>[^;]+);(?P<notify_command>[^;]+);(?P<description>.*)
EXTRACT-service_downtime = ^\[\d+\]\s+SERVICE DOWNTIME ALERT:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<state_type>[^;]+);(?P<comment>.*)
EXTRACT-host_downtime = ^\[\d+\]\s+HOST DOWNTIME ALERT:\s+(?P<dest>[^;]+);(?P<state_type>[^;]+);(?P<comment>.*)
EXTRACT-service_ack = ^\[\d+\]\s+SERVICE ACKNOWLEDGE ALERT:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<state_type>[^;]+);(?P<user>[^;]+);(?P<comment>.*)
EXTRACT-host_ack = ^\[\d+\]\s+HOST ACKNOWLEDGE ALERT:\s+(?P<dest>[^;]+);(?P<state_type>[^;]+);(?P<user>[^;]+);(?P<comment>.*)
EXTRACT-service_flapping = ^\[\d+\]\s+SERVICE FLAPPING ALERT:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<state_type>[^;]+);(?P<comment>.*)
EXTRACT-host_flapping = ^\[\d+\]\s+HOST FLAPPING ALERT:\s+(?P<dest>[^;]+);(?P<state_type>[^;]+);(?P<comment>.*)
EXTRACT-current_service_state = ^\[\d+\]\s+(?:CURRENT|INITIAL) SERVICE STATE:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<vendor_severity>[^;]+);(?P<state_type>[^;]+);(?P<attempt>[^;]+);(?P<description>.*)
EXTRACT-current_host_state = ^\[\d+\]\s+(?:CURRENT|INITIAL) HOST STATE:\s+(?P<dest>[^;]+);(?P<vendor_severity>[^;]+);(?P<state_type>[^;]+);(?P<attempt>[^;]+);(?P<description>.*)
EXTRACT-service_handler_started = ^\[\d+\]\s+SERVICE ALERT HANDLER STARTED:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<notify_command>.*)
EXTRACT-host_handler_started = ^\[\d+\]\s+HOST ALERT HANDLER STARTED:\s+(?P<dest>[^;]+);(?P<notify_command>.*)
EXTRACT-service_handler_stopped = ^\[\d+\]\s+SERVICE ALERT HANDLER STOPPED:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<notify_command>[^;]+);(?P<vendor_severity>[^;]+);(?P<description>.*)
EXTRACT-host_handler_stopped = ^\[\d+\]\s+HOST ALERT HANDLER STOPPED:\s+(?P<dest>[^;]+);(?P<notify_command>[^;]+);(?P<vendor_severity>[^;]+);(?P<description>.*)
EXTRACT-passive_service = ^\[\d+\]\s+PASSIVE SERVICE CHECK:\s+(?P<dest>[^;]+);(?P<signature>[^;]+);(?P<numeric_state>[^;]+);(?P<description>.*)
EXTRACT-passive_host = ^\[\d+\]\s+PASSIVE HOST CHECK:\s+(?P<dest>[^;]+);(?P<numeric_state>[^;]+);(?P<description>.*)
EXTRACT-external_command = ^\[\d+\]\s+EXTERNAL COMMAND:\s+(?P<description>.*)
EVAL-app = coalesce(app, "checkmk")
EVAL-vendor_product = coalesce(vendor_product, "Checkmk")
EVAL-body = coalesce(body, description, comment)
EVAL-description = coalesce(description, comment, body)
EVAL-dest_host = coalesce(dest_host, dest)
EVAL-signature = coalesce(signature, if(match(log_type, "^HOST"), "Host Check", signature))
EVAL-what = case(isnotnull(what), what, match(log_type, "^SERVICE"), "SERVICE", match(log_type, "^HOST"), "HOST", true(), what)
EVAL-id = coalesce(id, md5(history_epoch."|".coalesce(dest, "")."|".coalesce(signature, "host")."|".coalesce(log_type, "")."|".coalesce(vendor_severity, "")))
LOOKUP-checkmk_severity = checkmk_severity_lookup vendor_severity OUTPUTNEW severity, severity_id
LOOKUP-checkmk_log_class = checkmk_log_class_lookup log_type OUTPUTNEW log_class, cim_type
EVAL-type = coalesce(type, cim_type, "event")
EVAL-severity = coalesce(severity, "informational")

###### Site operational logs ######
[checkmk:notify]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
TRUNCATE = 10000
category = Checkmk
description = Checkmk notification module log (notify.log)
pulldown_type = 1
EXTRACT-notify = ^(?P<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:,\d+)?)(?:\s+\[(?P<log_level>[^\]]+)\])?(?:\s+\[(?P<logger>[^\]]+)\])?\s*(?P<message>.*)
EVAL-app = "checkmk"
EVAL-vendor_product = "Checkmk"

