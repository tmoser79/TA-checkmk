[checkmk_index]
definition = (index=checkmk)
iseval = 0
description = Default Checkmk index. Override in local/macros.conf if you use another index.

[checkmk_alerts]
definition = (`checkmk_index` (sourcetype=checkmk:alert OR sourcetype=checkmk:ec OR sourcetype=checkmk:status OR (sourcetype=checkmk:history (log_type="SERVICE ALERT" OR log_type="HOST ALERT" OR log_type="SERVICE NOTIFICATION" OR log_type="HOST NOTIFICATION"))))
iseval = 0
description = Checkmk monitoring alerts across HEC, Event Console, status snapshots, and history.

[checkmk_history]
definition = (`checkmk_index` sourcetype=checkmk:history)
iseval = 0

[checkmk_ops]
definition = (`checkmk_index` (sourcetype=checkmk:notify OR sourcetype=checkmk:mknotifyd OR sourcetype=checkmk:cmc OR sourcetype=checkmk:web OR sourcetype=checkmk:security OR sourcetype=checkmk:eventconsole))
iseval = 0

[checkmk_problems]
definition = (`checkmk_alerts` vendor_severity IN ("CRIT","CRITICAL","WARN","WARNING","DOWN","UNREACH","UNREACHABLE","UNKNOWN"))
iseval = 0
description = Non-OK Checkmk host and service problems.
