###### Site Apache (knowledge lives in Splunk_TA_apache; inputs are in this TA) ######
[checkmk_apache_access.sample]
index = web
sourcetype = apache:access:combined
source = /omd/sites/mysite/var/log/apache/access_log
interval = 30
count = 4
token.0.token = \[\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2} [+-]\d{4}\]
token.0.replacementType = timestamp
token.0.replacement = [%d/%b/%Y:%H:%M:%S %z]
token.1.token = @@ip
token.1.replacementType = random
token.1.replacement = ipv4
token.2.token = @@contact
token.2.replacementType = file
token.2.replacement = checkmk_contacts.list
token.3.token = @@host
token.3.replacementType = file
token.3.replacement = checkmk_hosts.list

[checkmk_apache_error.sample]
index = web
sourcetype = apache:error
source = /omd/sites/mysite/var/log/apache/error_log
interval = 90
count = 1
token.0.token = \[[A-Za-z]{3} [A-Za-z]{3} \d{2} \d{2}:\d{2}:\d{2} \d{4}\]
token.0.replacementType = timestamp
token.0.replacement = [%a %b %d %H:%M:%S %Y]
token.1.token = @@ip
token.1.replacementType = random
token.1.replacement = ipv4
