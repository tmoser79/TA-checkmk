# Sample data for SA-Eventgen (Splunkbase app 1924, 8.2.1+).
# Disabled by default so installing the TA cannot flood a production index.
# Enable in local/eventgen.conf:
#   [global]
#   disabled = false
#
# Do not put HEC tokens here. Spool output writes into Splunk's inbound spool
# directory on the instance that runs Eventgen (typically a lab search head).
#
# Timestamp tokens must not use a capture group. Eventgen replaces group 1
# when one is present and leaves the rest of the match in place, so a group
# around the digits of [epoch] is written as [[epoch]].

[global]
disabled = true
index = checkmk
host = checkmk.example.com
interval = 60
earliest = -60s
latest = now
timezone = 0000
mode = sample
sampletype = raw
outputMode = spool
spoolDir = $SPLUNK_HOME/var/spool/splunk
count = -1
randomizeCount = 0.2
randomizeEvents = true
breaker = [\r\n]+

###### HEC-shaped JSON (indexed as the event body, not the HEC envelope) ######
[checkmk_alert.sample]
sourcetype = checkmk:alert
source = checkmk:notification
interval = 30
count = 3
token.0.token = "time":\d{10}
token.0.replacementType = timestamp
token.0.replacement = "time":%s
token.1.token = @@host
token.1.replacementType = file
token.1.replacement = checkmk_hosts.list
token.2.token = @@service
token.2.replacementType = file
token.2.replacement = checkmk_services.list
token.3.token = @@contact
token.3.replacementType = file
token.3.replacement = checkmk_contacts.list
token.4.token = @@id
token.4.replacementType = integerid
token.4.replacement = 10000

[checkmk_ec.sample]
sourcetype = checkmk:ec
source = checkmk:eventconsole
interval = 45
count = 2
token.0.token = "time":\d{10}
token.0.replacementType = timestamp
token.0.replacement = "time":%s
token.1.token = @@host
token.1.replacementType = file
token.1.replacement = checkmk_hosts.list
token.2.token = @@id
token.2.replacementType = integerid
token.2.replacement = 50000

[checkmk_status.sample]
sourcetype = checkmk:status
